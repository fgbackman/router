name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make universal
      - name: pfctl accepts the generated rules
        run: |
          cat > /tmp/router.json <<'JSON'
          {
            "wan": {"interface": "en0"},
            "lan": {"interface": "en1", "address": "192.168.50.1/24"},
            "dhcp": {"enabled": true, "rangeStart": "192.168.50.100", "rangeEnd": "192.168.50.200", "leaseTime": "12h"},
            "dns": {"enabled": true, "domain": "lan"},
            "firewall": {
              "blockInbound": true, "allowPing": true, "openPorts": ["tcp/22"],
              "portForwards": [
                {"name": "web", "protocol": "tcp", "externalPort": 8080, "internalIP": "192.168.50.10", "internalPort": 80},
                {"name": "game", "protocol": "both", "externalPort": 3074, "internalIP": "192.168.50.11", "internalPort": 3074}
              ]
            },
            "web": {"enabled": false},
            "stateDir": "/tmp/router-state"
          }
          JSON
          sudo ./bin/router check -config /tmp/router.json

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Router.app (universal)
        run: UNIVERSAL=1 ./macos/build-app.sh
      - name: Check bundle
        run: |
          plutil -lint macos/build/Router.app/Contents/Info.plist
          lipo -info macos/build/Router.app/Contents/MacOS/Router
          codesign --verify --verbose macos/build/Router.app
      - uses: actions/upload-artifact@v4
        with:
          name: Router.app
          path: macos/build/Router.app
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Launch the app against a demo router and screenshot it
        run: |
          go run ./.github/demo &
          for i in $(seq 1 30); do curl -sf -u admin:demo-password http://127.0.0.1:8080/api/status >/dev/null && break; sleep 1; done
          ROUTER_APP_PASSWORD=demo-password macos/build/Router.app/Contents/MacOS/Router &
          sleep 12
          pgrep -x Router || (echo "app is not running"; exit 1)
          screencapture -x app.png
          sips -Z 1400 -s format jpeg -s formatOptions 70 app.png --out small.jpg >/dev/null
          echo "SCREENSHOT-BEGIN"; base64 -i small.jpg | fold -w 1000; echo "SCREENSHOT-END"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: app.png

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Router.xcodeproj -target Router -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/ios/build" build | grep -E "error:|warning: .*/ios/|BUILD"
          test -x ios/build/Debug-iphonesimulator/Router.app/Router
      - name: Build for devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/Router.xcodeproj -target Router -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/ios/build" build | tail -n 5
      - name: Run against a demo router and screenshot each tab
        run: |
          go run ./.github/demo &
          for i in $(seq 1 30); do curl -sf -u admin:demo-password http://127.0.0.1:8080/api/status >/dev/null && break; sleep 1; done
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Debug-iphonesimulator/Router.app
          for tab in status clients forwarding settings; do
            SIMCTL_CHILD_ROUTER_URL=http://127.0.0.1:8080 SIMCTL_CHILD_ROUTER_APP_PASSWORD=demo-password SIMCTL_CHILD_ROUTER_TAB=$tab \
              xcrun simctl launch "$UDID" com.fgbackman.router.ios
            sleep 8
            xcrun simctl io "$UDID" screenshot "ios-$tab.png"
            xcrun simctl terminate "$UDID" com.fgbackman.router.ios
            sips -Z 900 -s format jpeg -s formatOptions 60 "ios-$tab.png" --out "ios-$tab.jpg" >/dev/null
            echo "SHOT-$tab-BEGIN"; base64 -i "ios-$tab.jpg" | fold -w 1000; echo "SHOT-$tab-END"
          done
